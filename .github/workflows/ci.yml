# .github/workflows/ci.yml
#
# 이 프로젝트가 네 번 반복한 실패는 "선언했는데 아무도 돌려보지 않아 불일치가 유지된다"였다
# (TS-001 루트 features.json / init.sh 의 PROJECT_ROOT / TS-006 의 run_tests / TS-012 의 3건).
# CI 는 그 패턴에 대한 기계적 처방이다 — 선언한 모든 명령을 매 푸시마다 실제로 돌린다.
#
# 토큰 없는 모드이므로 **API 키 없이 전부 돈다**: 하네스 검증은 LLM 을 스텁으로
# 대체하고, 증거 게이트는 jest 만 쓴다. 비용 0.
#
# 건수를 여기 적지 않는 이유는 TS-024 — 스크립트가 늘면 주석이 조용히 거짓이 된다.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  harness:
    name: 하네스 검증 (LLM 없음)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_target/package-lock.json

      - name: 파이썬 의존성
        run: pip install -r requirements.txt

      - name: 대상 앱 의존성
        working-directory: web_target
        run: npm ci

      # 검증 스크립트는 LLM·네트워크를 쓰지 않는다. 키를 비워 그 사실을 강제한다.
      - name: TS-005 — LLM 오류 분류·백오프·종료 코드
        run: python verification/repro_ts005.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-006 — 증거 게이트 정책
        run: python verification/repro_ts006.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-008 — 명세-테스트 연결 판정
        run: python verification/repro_ts008.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-009 — 측정 계층 + 종료 상태 기록
        run: python verification/repro_ts009.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-010 — 토큰 없는 모드 의존성 독립
        run: python verification/repro_ts010.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-015 — 실행 기록 + 게이트 판정 집계
        run: python verification/repro_ts015.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-016 — 증거 커버리지 게이트 + 돌연변이 측정
        run: python verification/repro_ts016.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-017 — 설정 외부화·런너 추상화·프로젝트 검수
        run: python verification/repro_ts017.py
        env:
          GOOGLE_API_KEY: ""

      # 유료 경로 스모크 — LLM 을 스텁으로 바꿔 LangGraph 그래프를 끝까지 돌린다.
      # 토큰 0. 이것이 없으면 유료 경로가 리팩터 아래서 조용히 깨진다 (TS-018).
      - name: TS-018 — 유료 경로 스모크 (LangGraph, 토큰 0)
        run: python verification/repro_ts018.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-019 — 죽은 설정·고아 코드 재발 방지
        run: python verification/repro_ts019.py
        env:
          GOOGLE_API_KEY: ""

      # 세 검사 모두 '참조 0건'이라는 사실 판정이고 임계값이 없으므로 차단 근거가 선다.
      # 이 레포에 eval·importlib 동적 참조가 없음을 확인했다 (TS-019).
      - name: 하네스 자기 감사 (죽은 설정·고아 코드·미사용 임포트)
        run: python -m harness.cli deadcode

      - name: TS-020 — 증거 독립성
        run: python verification/repro_ts020.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-021 — 변이 연산자 + 돌연변이 게이트
        run: python verification/repro_ts021.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-022 — 탐지 범위 (표본 편향 + 컬렉션 연산자)
        run: python verification/repro_ts022.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-023 — 생존의 의미를 명세로 가린다
        run: python verification/repro_ts023.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-024 — 발표된 수치의 드리프트 차단
        run: python verification/repro_ts024.py
        env:
          GOOGLE_API_KEY: ""

      # 모든 회귀 검증이 `web_target`(React+TS+jest) 하나만 봤고, 두 번째 프로젝트에
      # 닿는 순간 결함 5개가 동시에 드러났다 (TS-025). 이 단계가 그 구멍을 기계화한다 —
      # `verification/fixtures/` 의 vanilla-js(vitest) · pytest-app(pytest) 는
      # 런너·규약·ID 형식·언어·설정 위치가 web_target 과 **모두 다르다.**
      # 런너는 설치하지 않는다(정적 계층만) — 다섯 결함 중 넷이 거기 있었고 비용이 0이다.
      - name: TS-025 — 외부 프로젝트 모양 (vitest · pytest 픽스처)
        run: python verification/repro_ts025.py
        env:
          GOOGLE_API_KEY: ""

      # 커버리지가 **파일**만 고르고 **줄**을 고르지 않아, 증거가 지나가지 않는 줄에
      # 변이를 넣고 그 생존을 증거의 구멍으로 셌다 (TS-026). 음성 대조로 'statement
      # 범위를 실행된 줄로 쓰면 안 된다'를 고정한다 — TS-022 를 오판으로 이끈 방법이다.
      - name: TS-026 — 미실행 줄 변이 차단 + 도달률 발표
        run: python verification/repro_ts026.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-027 — 노출 진단 (문서 선언 ↔ 검사기)
        run: python verification/repro_ts027.py
        env:
          GOOGLE_API_KEY: ""

      # 초안은 **상태 조건부 선언**에서만 뽑는다 — 무조건 속성(`role="main"`)에서
      # 만들면 뽑아낸 그 속성을 다시 읽는 한 지점 검사가 된다 (TS-028). 음성 대조로
      # 'role·aria-live·type 은 규칙에 없다'와 'ID 자릿수는 선언된 형식을 따른다'를 고정한다.
      - name: TS-028 — 명세 초안이 명세인가 (선언 기반 추출)
        run: python verification/repro_ts028.py
        env:
          GOOGLE_API_KEY: ""

      # 노출 **건수**로는 차단하지 않는다 — 노출은 결함이 아니라 조건이고, 건수로
      # 차단하면 "0건을 만들기 위해 진단을 끄는" 압력이 생긴다. 차단하는 것은
      # **TS 문서의 `exposure:` 선언과 검사기가 어긋날 때**뿐이다 — 어긋난 채로는
      # '노출 n건'이 믿을 수 없는 값이 된다 (TS-007·019 의 죽은 설정과 같은 구조).
      - name: 노출 진단 (선언과 검사기의 어긋남을 차단)
        run: python -m harness.cli exposure

      # 생성 파일과 실측이 어긋나면 **문서가 거짓을 말하고 있다**는 뜻이다.
      # 락파일 검사와 같은 방식이라 오탐이 구조적으로 불가능하다 (TS-024).
      - name: 측정값 드리프트 검사 (docs/status.md)
        run: python -m harness.cli status --check

      - name: 증거 태그 검사 (존재하지 않는 ID 는 실패)
        run: python -m harness.cli tags

      # 보고 전용 — 종료 코드 0. 임계값을 정하지 않았으므로 차단하지 않는다 (TS-020).
      - name: 증거 독립성 (수치를 로그에 남긴다)
        run: python -m harness.cli independence

      # `|| true` 를 뗐다 (TS-029). 왜 붙어 있었나 — 검수가 '위반'으로 올린 2건이
      # **검사기에 알려진 맹점이 있는** 판정이었다(재export·동적 import·전이 import).
      # 오탐이 섞인 판정으로 차단하면 CI 가 영구히 빨간불이 되므로 종료 코드를 버렸고,
      # 그 바람에 **정확한 판정**(죽은 npm 스크립트, 라우트 누락)의 차단력까지 잃었다.
      #
      # 지금은 `위반`(맹점 없음, 차단) 과 `권고`(맹점 있음, 보고) 를 나눈다.
      # 현재 위반 0 · 권고 2 이므로 차단력을 되찾고도 녹색이다 — 이제 죽은 스크립트가
      # 생기거나 선언된 라우트가 등록되지 않으면 **CI 가 막는다.**
      - name: 프로젝트 검수 (위반은 차단, 권고는 보고)
        run: python -m harness.cli inspect

      - name: 통과 플래그 전수 재검증
        run: python -m harness.cli audit

      # 실행 기록(harness_runtime.log)은 .gitignore 대상이라 CI 에는 없다.
      # 판별력 측정은 그와 무관하게 동작하고, 게이트/로그 집계는 "기록 없음"을 보고한다.
      - name: 판별력 측정 (수치를 로그에 남긴다)
        run: python -m harness.cli report

  target-app:
    name: 대상 앱 (lint · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_target
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_target/package-lock.json

      - run: npm ci

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 린트
        run: npm run lint

      - name: 빌드
        run: npm run build

      # 게이트와 같은 기준으로 본다 — npm test 는 커버리지 임계 때문에
      # 테스트가 전부 통과해도 exit 1 이다 (TS-012).
      - name: 단위 테스트 (게이트 기준)
        run: npx jest . --no-coverage

      - name: 커버리지 (참고용, 임계 미달이라 실패는 무시)
        run: npm test || true

  e2e:
    name: E2E (단위 테스트가 못 보는 영역)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_target
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_target/package-lock.json

      - run: npm ci

      # 설정이 요구하는 브라우저만 받는다 (chromium + webkit, firefox 제외)
      - name: Playwright 브라우저
        run: npx playwright install --with-deps chromium webkit

      # TS-013: 단위 테스트는 앱의 배선을 구조적으로 보지 못한다.
      # F-005 는 게이트를 통과했지만 실 브라우저에서 동작하지 않았고 E2E 가 잡았다.
      - name: E2E
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web_target/playwright-report/
          retention-days: 7
