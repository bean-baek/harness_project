# .github/workflows/ci.yml
#
# 이 프로젝트가 네 번 반복한 실패는 "선언했는데 아무도 돌려보지 않아 불일치가 유지된다"였다
# (TS-001 루트 features.json / init.sh 의 PROJECT_ROOT / TS-006 의 run_tests / TS-012 의 3건).
# CI 는 그 패턴에 대한 기계적 처방이다 — 선언한 모든 명령을 매 푸시마다 실제로 돌린다.
#
# 토큰 없는 모드이므로 **API 키 없이 전부 돈다**: 하네스 검증 491건은 LLM 을 스텁으로
# 대체하고, 증거 게이트는 jest 만 쓴다. 비용 0.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  harness:
    name: 하네스 검증 (LLM 없음)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_target/package-lock.json

      - name: 파이썬 의존성
        run: pip install -r requirements.txt

      - name: 대상 앱 의존성
        working-directory: web_target
        run: npm ci

      # 검증 스크립트는 LLM·네트워크를 쓰지 않는다. 키를 비워 그 사실을 강제한다.
      - name: TS-005 — LLM 오류 분류·백오프·종료 코드
        run: python verification/repro_ts005.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-006 — 증거 게이트 정책
        run: python verification/repro_ts006.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-008 — 명세-테스트 연결 판정
        run: python verification/repro_ts008.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-009 — 측정 계층 + 종료 상태 기록
        run: python verification/repro_ts009.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-010 — 토큰 없는 모드 의존성 독립
        run: python verification/repro_ts010.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-015 — 실행 기록 + 게이트 판정 집계
        run: python verification/repro_ts015.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-016 — 증거 커버리지 게이트 + 돌연변이 측정
        run: python verification/repro_ts016.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-017 — 설정 외부화·런너 추상화·프로젝트 검수
        run: python verification/repro_ts017.py
        env:
          GOOGLE_API_KEY: ""

      # 유료 경로 스모크 — LLM 을 스텁으로 바꿔 LangGraph 그래프를 끝까지 돌린다.
      # 토큰 0. 이것이 없으면 유료 경로가 리팩터 아래서 조용히 깨진다 (TS-018).
      - name: TS-018 — 유료 경로 스모크 (LangGraph, 토큰 0)
        run: python verification/repro_ts018.py
        env:
          GOOGLE_API_KEY: ""

      - name: TS-019 — 죽은 설정·고아 코드 재발 방지
        run: python verification/repro_ts019.py
        env:
          GOOGLE_API_KEY: ""

      # 세 검사 모두 '참조 0건'이라는 사실 판정이고 임계값이 없으므로 차단 근거가 선다.
      # 이 레포에 eval·importlib 동적 참조가 없음을 확인했다 (TS-019).
      - name: 하네스 자기 감사 (죽은 설정·고아 코드·미사용 임포트)
        run: python -m harness.cli deadcode

      - name: TS-020 — 증거 독립성
        run: python verification/repro_ts020.py
        env:
          GOOGLE_API_KEY: ""

      - name: 증거 태그 검사 (존재하지 않는 ID 는 실패)
        run: python -m harness.cli tags

      # 보고 전용 — 종료 코드 0. 임계값을 정하지 않았으므로 차단하지 않는다 (TS-020).
      - name: 증거 독립성 (수치를 로그에 남긴다)
        run: python -m harness.cli independence

      # 검수의 자동 판정 항목은 **의도와 무관하게** 틀린 것이므로 차단 근거가 선다.
      # 다만 현재 대상 앱에 위반 2건(미테스트 소스 14개, 미참조 export 7개)이 있어
      # 지금 차단하면 CI 가 영구히 빨간불이 된다. 보고만 하고 종료 코드는 무시한다 —
      # 숫자를 줄인 뒤 `|| true` 를 떼는 것이 다음 단계다.
      - name: 프로젝트 검수 (객관 지표 — 현재는 보고만)
        run: python -m harness.cli inspect || true

      - name: 통과 플래그 전수 재검증
        run: python -m harness.cli audit

      # 실행 기록(harness_runtime.log)은 .gitignore 대상이라 CI 에는 없다.
      # 판별력 측정은 그와 무관하게 동작하고, 게이트/로그 집계는 "기록 없음"을 보고한다.
      - name: 판별력 측정 (수치를 로그에 남긴다)
        run: python -m harness.cli report

  target-app:
    name: 대상 앱 (lint · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_target
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_target/package-lock.json

      - run: npm ci

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 린트
        run: npm run lint

      - name: 빌드
        run: npm run build

      # 게이트와 같은 기준으로 본다 — npm test 는 커버리지 임계 때문에
      # 테스트가 전부 통과해도 exit 1 이다 (TS-012).
      - name: 단위 테스트 (게이트 기준)
        run: npx jest . --no-coverage

      - name: 커버리지 (참고용, 임계 미달이라 실패는 무시)
        run: npm test || true

  e2e:
    name: E2E (단위 테스트가 못 보는 영역)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_target
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_target/package-lock.json

      - run: npm ci

      # 설정이 요구하는 브라우저만 받는다 (chromium + webkit, firefox 제외)
      - name: Playwright 브라우저
        run: npx playwright install --with-deps chromium webkit

      # TS-013: 단위 테스트는 앱의 배선을 구조적으로 보지 못한다.
      # F-005 는 게이트를 통과했지만 실 브라우저에서 동작하지 않았고 E2E 가 잡았다.
      - name: E2E
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web_target/playwright-report/
          retention-days: 7
